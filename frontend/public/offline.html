<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — SHAKA Personal Finance</title>
    <meta name="theme-color" content="#0e0e10" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0e0e10;
        color: #e8e8ea;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background-color: #17171a;
        border: 1px solid #26262b;
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 20%;
        right: 20%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #c9b27c, transparent);
      }
      .logo-box {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background-color: #202024;
        border: 1px solid rgba(201, 178, 124, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(201, 178, 124, 0.15);
      }
      .logo-box img {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 4px 12px;
        border-radius: 9999px;
        background-color: rgba(234, 179, 8, 0.1);
        color: #eab308;
        border: 1px solid rgba(234, 179, 8, 0.25);
        margin-bottom: 16px;
      }
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #eab308;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
        color: #ffffff;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #8a8a93;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        width: 100%;
        padding: 12px 20px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #c9b27c 0%, #b39a62 100%);
        color: #0e0e10;
        border: none;
        box-shadow: 0 4px 14px rgba(201, 178, 124, 0.25);
      }
      .btn-primary:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background-color: #202024;
        color: #e8e8ea;
        border: 1px solid #2e2e34;
      }
      .btn-secondary:hover {
        background-color: #26262c;
        border-color: rgba(201, 178, 124, 0.3);
      }
      .status {
        margin-top: 20px;
        font-size: 11px;
        color: #66666e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-box">
        <img src="/Logo.png" alt="SHAKA Logo" />
      </div>
      <div class="badge">
        <span class="pulse-dot"></span>
        <span>Offline Mode</span>
      </div>
      <h1>Connection Unavailable</h1>
      <p>
        SHAKA is currently disconnected from the network. Previously loaded ledger records remain securely available in your local cache.
      </p>
      <div class="actions">
        <button id="retry-btn" class="btn btn-primary" type="button">
          Retry Connection
        </button>
        <a href="/" class="btn btn-secondary">
          Open Cached Application
        </a>
      </div>
      <div id="status-msg" class="status">
        Listening for network reconnection...
      </div>
    </div>

    <script>
      const retryBtn = document.getElementById('retry-btn');
      const statusMsg = document.getElementById('status-msg');

      function attemptReconnect() {
        if (navigator.onLine) {
          statusMsg.textContent = 'Connection restored! Reloading application...';
          window.location.reload();
        } else {
          statusMsg.textContent = 'Still offline. Please check your Wi-Fi or mobile data.';
          setTimeout(() => {
            statusMsg.textContent = 'Listening for network reconnection...';
          }, 3000);
        }
      }

      retryBtn.addEventListener('click', attemptReconnect);

      window.addEventListener('online', () => {
        statusMsg.textContent = 'Network is back online. Reconnecting...';
        setTimeout(() => {
          window.location.reload();
        }, 500);
      });
    </script>
  </body>
</html>
